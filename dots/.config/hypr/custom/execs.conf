# hyprlang noerror false
# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

# Input method
# exec-once = fcitx5

# Cursor (overrides default Bibata-Modern-Classic from hyprland/execs.conf)
exec-once = hyprctl setcursor "Breeze_Light" 24


# Анимация включения (hairline): ждём запуска оболочки и раскрываем экран
exec-once = bash -c 'sleep 5 && qs -c ii ipc call powerTransition intro'
