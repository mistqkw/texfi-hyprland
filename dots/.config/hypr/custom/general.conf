# hyprlang noerror false
# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area

# HDMI port: mirror display. To see device name, use `hyprctl monitors`

# --- TexFi ---
# Файл грузится после hyprland/general.conf и переопределяет его блоки —
# так дотфайлы можно будет обновлять, не теряя правки.

decoration {
    # Острые углы у окон — не "минимально скруглённые", а буквально острые.
    rounding = 10
    rounding_power = 2

    shadow {
        enabled = false
    }
}

general {
    border_size = 1
    # Активная рамка — фирменный синий, фиксированный хексом: matugen не
    # красит рамку акцентом по умолчанию (берёт нейтральный outline_variant),
    # а именно рамка окна — самое частое, что видно на экране.
    col.active_border = rgba(4a7dfbff)
    col.inactive_border = rgba(26262cff)
}

animations {
    # Тот же словарь длительностей и кривых, что в AppMotion (texfi_fokus,
    # lib/core/theme/app_motion.dart): fast=150 normal=220 route=260 pop=180,
    # easeOut/easeIn/easeOutBack. Единица скорости в Hyprland — 100мс за 1.0
    # (было перепутано с 10мс — отсюда «всё очень медленно»: окно открывалось
    # за 2.2 секунды вместо 220мс).
    bezier = texfiEnter, 0.215, 0.61, 0.355, 1   # easeOutCubic
    bezier = texfiExit, 0.4, 0, 1, 1         # Curves.easeIn
    bezier = texfiPop, 0.215, 0.61, 0.355, 1     # hairline: без перелёта

    # Окно появляется как экран (AppMotion.normal, enter)
    animation = windowsIn, 1, 2.6, texfiEnter, popin 96%
    # Окно закрывается быстрее, чем открывается (AppMotion.fast, exit).
    # popin 96% — заметное схлопывание к центру, ближе к "рассыпалось",
    # чем плавный fade на месте (96% почти не сжимался).
    animation = windowsOut, 1, 1.8, texfiExit, popin 96%
    animation = windowsMove, 1, 1.8, texfiEnter
    animation = fadeIn, 1, 1.5, texfiEnter
    animation = fadeOut, 1, 1.5, texfiExit
    # Рамка — мгновенная реакция (AppMotion.instant), не тянущийся Material-blend
    animation = border, 1, 1.6, texfiEnter
    # Переключение workspace — это переход между экранами (AppMotion.route)
    animation = workspaces, 1, 2.4, texfiEnter, slidefade 8%
    # Всплывающие панели — "поп" с лёгким перелётом, как чекбокс/кнопка
    animation = layersIn, 1, 1.8, texfiPop, popin 97%
    animation = layersOut, 1, 1.5, texfiExit, popin 96%
    animation = fadeLayersIn, 1, 1.6, texfiEnter
    animation = fadeLayersOut, 1, 1.2, texfiExit
}
