source=~/.config/hypr/hyprlock/colors.conf

background {
    monitor =
    path = $background_image
    color = rgba(0a0a0cFF)
    blur_passes = 3
    blur_size = 7
    brightness = 0.35
    contrast = 0.9
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 1
    rounding = 10
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    check_color = $accent
    fail_color = rgba(f06060FF)
    capslock_color = rgba(e0a860FF)
    font_family = $font_family
    placeholder_text = <span foreground="##6b6b76">Пароль</span>
    fail_text = <span foreground="##f06060">Неверно</span>
    fade_on_empty = true
    position = 0, -20
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    font_size = 96
    font_family = $font_family_clock
    position = 0, 190
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %d %B" | tr '[:lower:]' '[:upper:]'
    color = $text_dim
    font_size = 13
    font_family = $font_family_mono
    position = 0, 105
    halign = center
    valign = center
}

label { # User
    monitor =
    text = $USER
    color = $text_dim
    font_size = 14
    font_family = $font_family_mono
    position = 0, -90
    halign = center
    valign = center
}

label { # Caps Lock Warning
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = 0, -140
    halign = center
    valign = center
}

label { # Layout
    monitor =
    text = $LAYOUT
    color = $text_dim
    font_size = 12
    font_family = $font_family_mono
    position = -30, 30
    halign = right
    valign = bottom
}

label { # Status
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $text_dim
    font_size = 12
    font_family = $font_family_mono
    position = 30, -30
    halign = left
    valign = top
}
