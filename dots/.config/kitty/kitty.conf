# Theming
# TexFi hairline: фиксированная палитра вместо цветов от обоев

# TexFi: ANSI-цвета (0-15/232+) остаются производными от обоев через matugen —
# это семантические цвета (красный/зелёный для git-диффов и т.д.), их нельзя
# перекрашивать в фирменный синий. А курсор и выделение — не семантика, это
# просто "фокус внимания", и там фирменный #4a7dfb фиксирован хексом, как
# рамка активного окна в Hyprland (custom/general.conf) — не зависит от
# обоев, чтобы курсор был узнаваем в любой теме.

# Transparency: background_opacity keeps kitty's own alpha compositing,
# so text stays fully opaque while only the background is see-through
# (unlike Hyprland's window opacity rule, which fades everything).

# Font
font_family      JetBrains Mono Nerd Font

# Cursor
# TexFi: блочный курсор читается как пиксельный "бит", а не как мягкая
# текстовая черта; cursor_trail — это плавный motion-blur шлейф, ровно та
# "мягкость", которую стиль убирает отовсюду (см. StyledRectangularShadow).
cursor_trail 0

# Padding (why weird value? consistency with foot)

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# --- TexFi hairline ---
foreground            #f4f4f6
background            #0a0a0c
background_opacity    0.94
cursor                #4a7dfb
cursor_text_color     #0a0a0c
cursor_shape          beam
cursor_beam_thickness 1.6
selection_foreground  #ffffff
selection_background  #4a7dfb
url_color             #4a7dfb
active_border_color   #4a7dfb
inactive_border_color #26262c
window_border_width   0
window_margin_width   0
window_padding_width  16
font_size             11.5
tab_bar_style         separator
tab_separator         "  "
active_tab_foreground   #f4f4f6
active_tab_background   #18181c
inactive_tab_foreground #6b6b76
inactive_tab_background #0a0a0c
color0  #18181c
color8  #6b6b76
color1  #f06060
color9  #ff8080
color2  #50c878
color10 #7ee0a0
color3  #e0a860
color11 #f0c080
color4  #4a7dfb
color12 #7fa3ff
color5  #b48cf0
color13 #cdb0ff
color6  #4ec9d4
color14 #80e0e8
color7  #a3a3ad
color15 #f4f4f6
